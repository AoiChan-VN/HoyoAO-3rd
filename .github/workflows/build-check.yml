name: Build Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install "scons>=4.4,<5"

      - name: Validate files
        run: bash scripts/verify_project.sh

      - name: Validate SConstruct syntax
        run: python -m py_compile SConstruct custom.py methods.py
