name: Native Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_CPP_API_VERSION: "4.7"
  ANDROID_API_LEVEL: "34"
  ANDROID_NDK_VERSION: "28.1.13356709"

jobs:
  windows-native:
    name: Windows Native
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify repository
        shell: bash
        run: |
          test -f native/extension/SConstruct
          echo "Repository structure OK."

      - name: Prepare godot-cpp
        shell: bash
        run: |
          set -e

          GODOT_CPP_DIR="native/extension/godot-cpp"

          if [ ! -f "$GODOT_CPP_DIR/SConstruct" ]; then
            rm -rf "$GODOT_CPP_DIR"

            git clone \
              --depth 1 \
              --branch godot-4.7-stable \
              https://github.com/godotengine/godot-cpp.git \
              "$GODOT_CPP_DIR"
          fi

          test -f "$GODOT_CPP_DIR/SConstruct"

          echo "godot-cpp:"
          git -C "$GODOT_CPP_DIR" rev-parse HEAD
          git -C "$GODOT_CPP_DIR" branch --show-current

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scons>=4.0,<5"

      - name: Verify MSVC
        shell: pwsh
        run: |
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue

          if (-not $cl) {
            throw "MSVC compiler (cl.exe) was not found."
          }

          Write-Host "MSVC: $($cl.Source)"

      - name: Build Windows Debug
        working-directory: native/extension
        run: |
          scons `
            platform=windows `
            target=template_debug `
            arch=x86_64 `
            api_version=${{ env.GODOT_CPP_API_VERSION }}

      - name: Build Windows Release
        working-directory: native/extension
        run: |
          scons `
            platform=windows `
            target=template_release `
            arch=x86_64 `
            api_version=${{ env.GODOT_CPP_API_VERSION }}

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $dlls = Get-ChildItem `
            -Path "native/extension/bin" `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue

          if (-not $dlls) {
            throw "No Windows DLL artifacts were produced."
          }

          $dlls | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload Windows Native Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native/extension/bin/*.dll
          if-no-files-found: error


  android-native:
    name: Android Native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify repository
        shell: bash
        run: |
          set -e

          test -f native/extension/SConstruct
          echo "Repository structure OK."

      - name: Prepare godot-cpp
        shell: bash
        run: |
          set -e

          GODOT_CPP_DIR="native/extension/godot-cpp"

          if [ ! -f "$GODOT_CPP_DIR/SConstruct" ]; then
            rm -rf "$GODOT_CPP_DIR"

            git clone \
              --depth 1 \
              --branch godot-4.7-stable \
              https://github.com/godotengine/godot-cpp.git \
              "$GODOT_CPP_DIR"
          fi

          test -f "$GODOT_CPP_DIR/SConstruct"

          echo "godot-cpp:"
          git -C "$GODOT_CPP_DIR" rev-parse HEAD
          git -C "$GODOT_CPP_DIR" branch --show-current

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scons>=4.0,<5"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;34.0.0"

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

          test -d "${ANDROID_SDK_ROOT}"

          echo "Installed NDKs:"
          ls -la "${ANDROID_SDK_ROOT}/ndk"

      - name: Verify Android NDK
        shell: bash
        run: |
          set -e

          NDK_DIR="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          test -d "$NDK_DIR"

          test -d \
            "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"

          test -f \
            "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          echo "NDK verified:"
          echo "$NDK_DIR"

      - name: Export Android toolchain
        shell: bash
        run: |
          NDK_DIR="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build Android Debug arm64
        working-directory: native/extension
        run: |
          scons \
            platform=android \
            target=template_debug \
            arch=arm64 \
            android_api_level=${ANDROID_API_LEVEL} \
            api_version=${GODOT_CPP_API_VERSION}

      - name: Build Android Release arm64
        working-directory: native/extension
        run: |
          scons \
            platform=android \
            target=template_release \
            arch=arm64 \
            android_api_level=${ANDROID_API_LEVEL} \
            api_version=${GODOT_CPP_API_VERSION}

      - name: Verify Android artifacts
        shell: bash
        run: |
          set -e

          find native/extension/bin \
            -type f \
            -name "*.so" \
            -print

          COUNT=$(find native/extension/bin \
            -type f \
            -name "*.so" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "No Android .so artifacts were produced."
            exit 1
          fi

      - name: Upload Android Native Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: native/extension/bin/*.so
          if-no-files-found: error
