name: Build C++ GDExtension - Android ARM64

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_CPP_API_VERSION: "4.7"
  ANDROID_ABI: "arm64"
  BUILD_TARGET: "template_release"
  PRECISION: "single"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          python -m pip install "scons>=4.4,<5"

      - name: Verify project structure
        run: bash scripts/verify_project.sh

      - name: Build C++ GDExtension
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache
        run: |
          scons \
            platform=android \
            arch=arm64 \
            target=${BUILD_TARGET} \
            precision=${PRECISION} \
            api_version=${GODOT_CPP_API_VERSION} \
            -j2

      - name: Verify ARM64 ELF
        run: |
          test -f project/bin/android/libaoi_native.android.template_release.arm64.so
          file project/bin/android/libaoi_native.android.template_release.arm64.so
          readelf -h project/bin/android/libaoi_native.android.template_release.arm64.so | grep -E "Class|Machine"

      - name: Package artifact
        run: |
          mkdir -p dist
          cp project/bin/android/libaoi_native.android.template_release.arm64.so dist/
          cp project/bin/aoi_native.gdextension dist/
          tar -C dist -czf aoi-native-android-arm64-godot-4.7.2.tar.gz .

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: aoi-native-android-arm64-godot-4.7.2
          path: |
            project/bin/android/libaoi_native.android.template_release.arm64.so
            project/bin/aoi_native.gdextension

      - name: Upload packaged native runtime
        uses: actions/upload-artifact@v4
        with:
          name: aoi-native-package-android-arm64-godot-4.7.2
          path: dist/aoi-native-android-arm64-godot-4.7.2.tar.gz
