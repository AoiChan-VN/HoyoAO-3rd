name: Build C++ GDExtension - Godot 4.7.2 Android ARM64

on:
  workflow_dispatch:

  push:
    branches:
      - "**"

  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2-stable"

  GODOT_CPP_REF: "master"
  GODOT_CPP_API_VERSION: "4.7"

  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "28.0.13004108"

  JAVA_VERSION: "17"

  PLATFORM: "android"
  ARCH: "arm64"
  TARGET: "template_release"
  PRECISION: "single"

  LIB_NAME: "libaoi_native.android.template_release.arm64.so"


jobs:

  build:

    name: Android ARM64 Release

    runs-on: ubuntu-24.04

    timeout-minutes: 90


    steps:

      # ==========================================================
      # 01 — CHECKOUT
      # ==========================================================

      - name: Checkout project

        uses: actions/checkout@v4

        with:
          fetch-depth: 1


      # ==========================================================
      # 02 — PYTHON
      # ==========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==========================================================
      # 03 — JAVA
      # ==========================================================

      - name: Setup Java

        uses: actions/setup-java@v4

        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================================
      # 04 — ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK

        uses: android-actions/setup-android@v3


      # ==========================================================
      # 05 — ANDROID SDK + NDK
      # ==========================================================

      - name: Install Android SDK and NDK

        shell: bash

        run: |

          set -euo pipefail

          echo "Installing Android SDK..."

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=${ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          echo ""
          echo "Android SDK:"
          echo "${ANDROID_SDK_ROOT}"

          echo ""
          echo "Android NDK:"
          echo "${ANDROID_NDK_ROOT}"


      # ==========================================================
      # 06 — VERIFY NDK
      # ==========================================================

      - name: Verify Android NDK

        shell: bash

        run: |

          set -euo pipefail

          test -d "${ANDROID_NDK_ROOT}"

          test -f \
            "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          test -f \
            "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          echo "Android NDK verified."


      # ==========================================================
      # 07 — SCONS
      # ==========================================================

      - name: Install SCons

        shell: bash

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "scons>=4.4,<5"

          scons --version


      # ==========================================================
      # 08 — DOWNLOAD GODOT-CPP
      #
      # NO SUBMODULE
      # NO LOCAL MACHINE
      # NO USER MACHINE
      # ==========================================================

      - name: Download godot-cpp

        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================================="
          echo " Downloading godot-cpp"
          echo "=========================================================="

          rm -rf godot-cpp

          git clone \
            --depth 1 \
            --branch "${GODOT_CPP_REF}" \
            https://github.com/godotengine/godot-cpp.git \
            godot-cpp

          test -d godot-cpp

          test -f godot-cpp/SConstruct

          echo ""
          echo "godot-cpp downloaded."

          echo ""
          echo "Commit:"

          git -C godot-cpp rev-parse HEAD


      # ==========================================================
      # 09 — VERIFY GODOT-CPP
      # ==========================================================

      - name: Verify godot-cpp API

        shell: bash

        run: |

          set -euo pipefail

          echo "godot-cpp API target:"
          echo "${GODOT_CPP_API_VERSION}"

          grep -q \
            '"4.7"' \
            godot-cpp/tools/godotcpp.py

          echo ""
          echo "godot-cpp API 4.7: OK"


      # ==========================================================
      # 10 — VERIFY PROJECT
      # ==========================================================

      - name: Verify project

        shell: bash

        run: |

          set -euo pipefail

          chmod +x scripts/verify_project.sh

          bash scripts/verify_project.sh


      # ==========================================================
      # 11 — PREPARE CACHE
      # ==========================================================

      - name: Prepare build cache

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p .scons_cache

          mkdir -p project/bin/android


      # ==========================================================
      # 12 — SCONS CACHE
      # ==========================================================

      - name: Cache SCons

        uses: actions/cache@v4

        with:

          path: |
            .scons_cache
            godot-cpp/bin
            godot-cpp/gen

          key: >-
            godot-cpp-
            ${GODOT_CPP_API_VERSION}-
            android-
            ${ARCH}-
            ${TARGET}-
            ${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'SConstruct') }}

          restore-keys: |
            godot-cpp-4.7-android-arm64-template_release-


      # ==========================================================
      # 13 — BUILD
      # ==========================================================

      - name: Build C++ native library

        shell: bash

        env:

          SCONS_CACHE: "${{ github.workspace }}/.scons_cache"

        run: |

          set -euo pipefail

          echo ""
          echo "=========================================================="
          echo " C++ NATIVE BUILD"
          echo "=========================================================="

          echo "Godot       : ${GODOT_VERSION}"
          echo "godot-cpp   : ${GODOT_CPP_API_VERSION}"
          echo "Platform    : ${PLATFORM}"
          echo "Architecture: ${ARCH}"
          echo "Target      : ${TARGET}"
          echo "Precision   : ${PRECISION}"

          echo ""
          echo "=========================================================="

          scons \
            platform="${PLATFORM}" \
            arch="${ARCH}" \
            target="${TARGET}" \
            precision="${PRECISION}" \
            api_version="${GODOT_CPP_API_VERSION}" \
            -j2

          echo ""
          echo "C++ build finished."


      # ==========================================================
      # 14 — LOCATE .SO
      # ==========================================================

      - name: Locate native library

        shell: bash

        run: |

          set -euo pipefail

          echo "Searching for .so..."

          find . \
            -type f \
            -name "*.so" \
            -print

          echo ""

          if [[ ! -f "bin/android/${LIB_NAME}" ]]; then

            echo ""
            echo "ERROR: Expected .so was not generated:"
            echo ""
            echo "bin/android/${LIB_NAME}"
            echo ""

            exit 1

          fi

          echo ""
          echo "Native library found."


      # ==========================================================
      # 15 — COPY TO GODOT PROJECT
      # ==========================================================

      - name: Copy native library

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p project/bin/android

          cp \
            "bin/android/${LIB_NAME}" \
            "project/bin/android/${LIB_NAME}"

          test -f \
            "project/bin/android/${LIB_NAME}"

          echo ""
          echo "Installed:"
          echo "project/bin/android/${LIB_NAME}"


      # ==========================================================
      # 16 — ELF VALIDATION
      # ==========================================================

      - name: Validate ARM64 ELF

        shell: bash

        run: |

          set -euo pipefail

          LIB="project/bin/android/${LIB_NAME}"

          echo ""
          echo "=========================================================="
          echo " ARM64 ELF VALIDATION"
          echo "=========================================================="

          file "${LIB}"

          echo ""

          readelf -h "${LIB}" | grep "Class"

          readelf -h "${LIB}" | grep "Machine"

          echo ""

          file "${LIB}" | grep -Eiq \
            "ARM aarch64|ARM64|aarch64"

          echo ""
          echo "ARM64 ELF validation: PASS"


      # ==========================================================
      # 17 — GDEXTENSION VALIDATION
      # ==========================================================

      - name: Validate GDExtension descriptor

        shell: bash

        run: |

          set -euo pipefail

          FILE="project/bin/aoi_native.gdextension"

          test -f "${FILE}"

          grep -q \
            'entry_symbol = "aoi_native_library_init"' \
            "${FILE}"

          grep -q \
            'compatibility_minimum = "4.7"' \
            "${FILE}"

          grep -q \
            'android.release.arm64' \
            "${FILE}"

          grep -q \
            "${LIB_NAME}" \
            "${FILE}"

          echo ""
          echo "GDExtension descriptor: PASS"


      # ==========================================================
      # 18 — SIZE REPORT
      # ==========================================================

      - name: Native library size

        shell: bash

        run: |

          set -euo pipefail

          LIB="project/bin/android/${LIB_NAME}"

          echo ""
          echo "Native library size:"

          ls -lh "${LIB}"

          echo ""

          du -h "${LIB}"


      # ==========================================================
      # 19 — PACKAGE
      # ==========================================================

      - name: Package Android ARM64 artifact

        shell: bash

        run: |

          set -euo pipefail

          rm -rf dist

          mkdir -p \
            dist/android/arm64

          cp \
            "project/bin/android/${LIB_NAME}" \
            "dist/android/arm64/"

          cp \
            "project/bin/aoi_native.gdextension" \
            "dist/"

          cp \
            "project/project.godot" \
            "dist/"

          tar \
            -C dist \
            -czf \
            "godot-4.7.2-cpp-android-arm64.tar.gz" \
            .


      # ==========================================================
      # 20 — UPLOAD .SO
      # ==========================================================

      - name: Upload .so artifact

        uses: actions/upload-artifact@v4

        with:

          name: "godot-4.7.2-cpp-android-arm64-so"

          path: |
            project/bin/android/${{ env.LIB_NAME }}
            project/bin/aoi_native.gdextension

          if-no-files-found: error


      # ==========================================================
      # 21 — UPLOAD PACKAGE
      # ==========================================================

      - name: Upload complete package

        uses: actions/upload-artifact@v4

        with:

          name: "godot-4.7.2-cpp-android-arm64"

          path: |
            dist/godot-4.7.2-cpp-android-arm64.tar.gz

          if-no-files-found: error


      # ==========================================================
      # 22 — SUCCESS
      # ==========================================================

      - name: Build success

        shell: bash

        run: |

          echo ""
          echo "=========================================================="
          echo " BUILD SUCCESS"
          echo "=========================================================="

          echo ""
          echo "Godot:"
          echo "  ${GODOT_VERSION}"

          echo ""
          echo "Native:"
          echo "  C++ GDExtension"

          echo ""
          echo "Platform:"
          echo "  Android"

          echo ""
          echo "ABI:"
          echo "  arm64-v8a"

          echo ""
          echo "Target:"
          echo "  ${TARGET}"

          echo ""
          echo "Precision:"
          echo "  ${PRECISION}"

          echo ""
          echo "Output:"
          echo "  project/bin/android/${LIB_NAME}"

          echo ""
          echo "==========================================================" 
