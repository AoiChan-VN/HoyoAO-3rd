name: Build C++ GDExtension - Godot 4.7.2 Android ARM64

on:
  workflow_dispatch:

  push:
    branches:
      - "**"

  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_CPP_REF: "master"
  GODOT_CPP_API_VERSION: "4.7"

  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "28.0.13004108"

  JAVA_VERSION: "17"

  PLATFORM: "android"
  ARCH: "arm64"
  TARGET: "template_release"
  PRECISION: "single"

jobs:

  build:

    name: Build Android ARM64 .so

    runs-on: ubuntu-24.04

    timeout-minutes: 90

    steps:

      # ==========================================================
      # 01 - CHECKOUT GAME PROJECT
      # ==========================================================

      - name: Checkout game project

        uses: actions/checkout@v4

        with:
          fetch-depth: 1


      # ==========================================================
      # 02 - INSTALL PYTHON
      # ==========================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==========================================================
      # 03 - INSTALL JAVA
      # ==========================================================

      - name: Setup Java 17

        uses: actions/setup-java@v4

        with:
          distribution: "temurin"
          java-version: "17"


      # ==========================================================
      # 04 - INSTALL ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK

        uses: android-actions/setup-android@v3


      # ==========================================================
      # 05 - INSTALL ANDROID PLATFORM / NDK
      # ==========================================================

      - name: Install Android SDK components

        shell: bash

        run: |

          set -euo pipefail

          echo "Installing Android SDK components..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "Android SDK installation complete."


      # ==========================================================
      # 06 - VERIFY ANDROID NDK
      # ==========================================================

      - name: Verify Android NDK

        shell: bash

        run: |

          set -euo pipefail

          echo "NDK:"
          echo "${ANDROID_NDK_ROOT}"

          test -d "${ANDROID_NDK_ROOT}"

          test -f \
            "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          test -f \
            "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          echo "Android NDK OK."


      # ==========================================================
      # 07 - INSTALL SCONS
      # ==========================================================

      - name: Install SCons

        shell: bash

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "scons>=4.4,<5"

          scons --version


      # ==========================================================
      # 08 - DOWNLOAD GODOT-CPP DIRECTLY
      #
      # IMPORTANT:
      # NO GIT SUBMODULE
      # NO LOCAL MACHINE
      # NO USER ACTION
      # ==========================================================

      - name: Download godot-cpp

        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================================="
          echo " Download godot-cpp"
          echo "=========================================================="

          rm -rf godot-cpp

          git clone \
            --depth 1 \
            --branch "${GODOT_CPP_REF}" \
            https://github.com/godotengine/godot-cpp.git \
            godot-cpp

          test -d godot-cpp

          test -f godot-cpp/SConstruct

          echo ""
          echo "godot-cpp downloaded successfully."

          echo ""
          echo "godot-cpp commit:"

          git -C godot-cpp rev-parse HEAD

          echo ""
          echo "godot-cpp branch/ref:"

          git -C godot-cpp branch --show-current

      # ==========================================================
      # 09 - VERIFY GODOT-CPP API
      # ==========================================================

      - name: Verify godot-cpp API

        shell: bash

        run: |

          set -euo pipefail

          echo "Checking supported API versions..."

          grep -n \
            'supported_api_versions' \
            godot-cpp/tools/godotcpp.py

          echo ""

          grep -n \
            '"4.7"' \
            godot-cpp/tools/godotcpp.py

          echo ""

          echo "godot-cpp API 4.7 verified."


      # ==========================================================
      # 10 - VERIFY PROJECT STRUCTURE
      # ==========================================================

      - name: Verify project structure

        shell: bash

        run: |

          set -euo pipefail

          chmod +x scripts/verify_project.sh

          bash scripts/verify_project.sh


      # ==========================================================
      # 11 - PREPARE BUILD DIRECTORY
      # ==========================================================

      - name: Prepare build directories

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p project/bin/android

          mkdir -p .scons_cache


      # ==========================================================
      # 12 - CACHE GODOT-CPP / SCONS
      # ==========================================================

      - name: Cache SCons

        uses: actions/cache@v4

        with:

          path: |
            .scons_cache
            godot-cpp/bin
            godot-cpp/gen

          key: >-
            godot-cpp-4.7-
            android-
            arm64-
            ${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'SConstruct') }}

          restore-keys: |
            godot-cpp-4.7-android-arm64-


      # ==========================================================
      # 13 - BUILD C++
      # ==========================================================

      - name: Build native C++ GDExtension

        shell: bash

        env:

          SCONS_CACHE: ${{ github.workspace }}/.scons_cache

        run: |

          set -euo pipefail

          echo ""
          echo "=========================================================="
          echo " C++ NATIVE BUILD"
          echo "=========================================================="

          echo "Godot       : ${GODOT_VERSION}"
          echo "godot-cpp   : ${GODOT_CPP_BRANCH}"
          echo "Platform    : ${PLATFORM}"
          echo "Architecture: ${ARCH}"
          echo "Target      : ${TARGET}"
          echo "Precision   : ${PRECISION}"

          echo "=========================================================="
          echo ""

          scons \
            platform="${PLATFORM}" \
            arch="${ARCH}" \
            target="${TARGET}" \
            precision="${PRECISION}" \
            api_version="${GODOT_CPP_API_VERSION}" \
            -j2

          echo ""
          echo "C++ compilation finished."


      # ==========================================================
      # 14 - FIND GENERATED SO
      # ==========================================================

      - name: Find generated shared library

        shell: bash

        run: |

          set -euo pipefail

          echo "Searching for generated .so..."

          find . \
            -type f \
            -name "*.so" \
            -print

          echo ""

          test -f \
            "bin/android/libaoi_native.android.template_release.arm64.so"


      # ==========================================================
      # 15 - COPY SO INTO GODOT PROJECT
      # ==========================================================

      - name: Install .so into Godot project

        shell: bash

        run: |

          set -euo pipefail

          mkdir -p project/bin/android

          cp \
            "bin/android/libaoi_native.android.template_release.arm64.so" \
            "project/bin/android/libaoi_native.android.template_release.arm64.so"

          test -f \
            "project/bin/android/libaoi_native.android.template_release.arm64.so"

          echo ""
          echo "Native library installed into Godot project."


      # ==========================================================
      # 16 - VERIFY ELF
      # ==========================================================

      - name: Verify ARM64 ELF

        shell: bash

        run: |

          set -euo pipefail

          LIB="project/bin/android/libaoi_native.android.template_release.arm64.so"

          echo ""
          echo "=========================================================="
          echo " ELF VALIDATION"
          echo "=========================================================="

          file "${LIB}"

          echo ""

          readelf -h "${LIB}" | grep "Class"

          readelf -h "${LIB}" | grep "Machine"

          echo ""

          if file "${LIB}" | grep -Eiq \
            "ARM aarch64|ARM64|aarch64"; then

            echo "ARM64 ELF: PASS"

          else

            echo "ERROR: Generated library is NOT ARM64."

            exit 1

          fi


      # ==========================================================
      # 17 - VERIFY GDEXTENSION
      # ==========================================================

      - name: Verify GDExtension descriptor

        shell: bash

        run: |

          set -euo pipefail

          FILE="project/bin/aoi_native.gdextension"

          test -f "${FILE}"

          grep -q \
            'entry_symbol = "aoi_native_library_init"' \
            "${FILE}"

          grep -q \
            'compatibility_minimum = "4.7"' \
            "${FILE}"

          grep -q \
            'android.release.arm64' \
            "${FILE}"

          grep -q \
            'libaoi_native.android.template_release.arm64.so' \
            "${FILE}"

          echo "GDExtension descriptor: PASS"


      # ==========================================================
      # 18 - CHECK SIZE
      # ==========================================================

      - name: Report native library size

        shell: bash

        run: |

          set -euo pipefail

          LIB="project/bin/android/libaoi_native.android.template_release.arm64.so"

          echo ""
          echo "Native .so size:"

          ls -lh "${LIB}"

          echo ""

          du -h "${LIB}"


      # ==========================================================
      # 19 - PACKAGE
      # ==========================================================

      - name: Create release package

        shell: bash

        run: |

          set -euo pipefail

          rm -rf dist

          mkdir -p \
            dist/android/arm64

          cp \
            "project/bin/android/libaoi_native.android.template_release.arm64.so" \
            "dist/android/arm64/"

          cp \
            "project/bin/aoi_native.gdextension" \
            "dist/"

          cp \
            "project/project.godot" \
            "dist/"

          cp \
            "README.md" \
            "dist/"

          tar \
            -C dist \
            -czf \
            "aoi-native-godot-4.7.2-android-arm64.tar.gz" \
            .


      # ==========================================================
      # 20 - UPLOAD .SO
      # ==========================================================

      - name: Upload Android ARM64 .so

        uses: actions/upload-artifact@v4

        with:

          name: "godot-4.7.2-cpp-android-arm64-so"

          path: |
            project/bin/android/libaoi_native.android.template_release.arm64.so
            project/bin/aoi_native.gdextension

          if-no-files-found: error


      # ==========================================================
      # 21 - UPLOAD COMPLETE PACKAGE
      # ==========================================================

      - name: Upload complete package

        uses: actions/upload-artifact@v4

        with:

          name: "godot-4.7.2-cpp-android-arm64-package"

          path: |
            dist/aoi-native-godot-4.7.2-android-arm64.tar.gz

          if-no-files-found: error


      # ==========================================================
      # 22 - FINAL
      # ==========================================================

      - name: Build complete

        shell: bash

        run: |

          echo ""
          echo "=========================================================="
          echo " BUILD SUCCESS"
          echo "=========================================================="

          echo ""
          echo "Godot:"
          echo "  4.7.2"

          echo ""
          echo "Native:"
          echo "  C++ / GDExtension"

          echo ""
          echo "Platform:"
          echo "  Android"

          echo ""
          echo "ABI:"
          echo "  arm64-v8a"

          echo ""
          echo "Target:"
          echo "  template_release"

          echo ""
          echo "Output:"
          echo "  project/bin/android/"
          echo "  libaoi_native.android.template_release.arm64.so"

          echo ""
          echo "==========================================================" 
