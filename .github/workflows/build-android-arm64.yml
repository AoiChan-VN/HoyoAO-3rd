name: Build C++ GDExtension - Godot 4.7.2 - Android ARM64

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_CPP_API_VERSION: "4.7"

  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "28.0.13004108"

  JAVA_VERSION: "17"

  TARGET: "template_release"
  PRECISION: "single"
  ARCH: "arm64"

jobs:

  build-android-arm64:

    name: Android ARM64 Release

    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          submodules: false


      # ============================================================
      # 2. INITIALIZE GODOT-CPP
      # ============================================================

      - name: Initialize godot-cpp

        shell: bash

        run: |

          set -euo pipefail

          echo "Initializing git submodules..."

          git submodule sync --recursive

          git submodule update --init --recursive

          echo ""
          echo "Checking godot-cpp..."

          test -d godot-cpp

          test -f godot-cpp/SConstruct

          echo "godot-cpp initialized successfully."


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Setup Java 17

        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. PYTHON
      # ============================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK

        uses: android-actions/setup-android@v3


      # ============================================================
      # 6. ANDROID SDK / NDK
      # ============================================================

      - name: Install Android SDK / NDK

        shell: bash

        run: |

          set -euo pipefail

          sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"


      # ============================================================
      # 7. VERIFY TOOLCHAIN
      # ============================================================

      - name: Verify Android toolchain

        shell: bash

        run: |

          set -euo pipefail

          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "SCons:"
          python -m pip install --upgrade pip
          python -m pip install "scons>=4.4,<5"
          scons --version

          echo ""
          echo "Android SDK:"
          echo "${ANDROID_SDK_ROOT}"

          echo ""
          echo "Android NDK:"
          echo "${ANDROID_NDK_ROOT}"

          test -d "${ANDROID_NDK_ROOT}"

          test -f "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          echo ""
          echo "Android toolchain OK."


      # ============================================================
      # 8. PROJECT VALIDATION
      # ============================================================

      - name: Verify project

        shell: bash

        run: |

          set -euo pipefail

          chmod +x scripts/verify_project.sh

          bash scripts/verify_project.sh


      # ============================================================
      # 9. SCONS CACHE
      # ============================================================

      - name: Restore SCons cache

        uses: actions/cache@v4

        with:

          path: |
            .scons_cache
            godot-cpp/bin
            godot-cpp/gen

          key: >
            godot-cpp-4.7.2-
            android-
            arm64-
            ${{ hashFiles('.gitmodules') }}-
            ${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'SConstruct') }}

          restore-keys: |
            godot-cpp-4.7.2-android-arm64-


      # ============================================================
      # 10. BUILD
      # ============================================================

      - name: Build Android ARM64 GDExtension

        shell: bash

        env:

          SCONS_CACHE:
            ${{ github.workspace }}/.scons_cache

        run: |

          set -euo pipefail

          echo "============================================================"
          echo "Building C++ GDExtension"
          echo "Godot       : ${GODOT_VERSION}"
          echo "godot-cpp   : API ${GODOT_CPP_API_VERSION}"
          echo "Platform    : Android"
          echo "Architecture: ARM64"
          echo "Target      : ${TARGET}"
          echo "Precision   : ${PRECISION}"
          echo "============================================================"

          scons \
            platform=android \
            arch=${ARCH} \
            target=${TARGET} \
            precision=${PRECISION} \
            api_version=${GODOT_CPP_API_VERSION} \
            -j2


      # ============================================================
      # 11. LOCATE OUTPUT
      # ============================================================

      - name: Locate shared library

        shell: bash

        run: |

          set -euo pipefail

          echo "Searching generated .so files..."

          find . \
            -type f \
            -name "*.so" \
            -print

          echo ""

          test -f \
            "project/bin/android/libaoi_native.android.template_release.arm64.so"

          echo ""
          echo "Native library found."


      # ============================================================
      # 12. VERIFY ELF
      # ============================================================

      - name: Verify ARM64 ELF

        shell: bash

        run: |

          set -euo pipefail

          LIB="project/bin/android/libaoi_native.android.template_release.arm64.so"

          echo "Checking:"
          echo "${LIB}"

          file "${LIB}"

          echo ""

          readelf -h "${LIB}" | grep "Class"

          readelf -h "${LIB}" | grep "Machine"

          echo ""

          echo "Checking ARM64 architecture..."

          file "${LIB}" | grep -Ei \
            "ARM aarch64|ARM64|aarch64"

          echo ""

          echo "ELF validation passed."


      # ============================================================
      # 13. VERIFY GDEXTENSION DESCRIPTOR
      # ============================================================

      - name: Verify GDExtension descriptor

        shell: bash

        run: |

          set -euo pipefail

          FILE="project/bin/aoi_native.gdextension"

          test -f "${FILE}"

          grep -q \
            'android.release.arm64' \
            "${FILE}"

          grep -q \
            'libaoi_native.android.template_release.arm64.so' \
            "${FILE}"

          echo "GDExtension descriptor OK."


      # ============================================================
      # 14. SHOW SIZE
      # ============================================================

      - name: Native library size

        shell: bash

        run: |

          set -euo pipefail

          LIB="project/bin/android/libaoi_native.android.template_release.arm64.so"

          ls -lh "${LIB}"

          du -h "${LIB}"


      # ============================================================
      # 15. PACKAGE
      # ============================================================

      - name: Package artifact

        shell: bash

        run: |

          set -euo pipefail

          rm -rf dist

          mkdir -p dist/android/arm64

          cp \
            project/bin/android/libaoi_native.android.template_release.arm64.so \
            dist/android/arm64/

          cp \
            project/bin/aoi_native.gdextension \
            dist/

          cp \
            README.md \
            dist/

          tar \
            -C dist \
            -czf \
            aoi-native-godot-4.7.2-android-arm64.tar.gz \
            .


      # ============================================================
      # 16. UPLOAD .SO
      # ============================================================

      - name: Upload Android ARM64 .so

        uses: actions/upload-artifact@v4

        with:

          name:
            aoi-native-godot-4.7.2-android-arm64

          path: |
            project/bin/android/libaoi_native.android.template_release.arm64.so
            project/bin/aoi_native.gdextension

          if-no-files-found: error


      # ============================================================
      # 17. UPLOAD COMPLETE PACKAGE
      # ============================================================

      - name: Upload complete package

        uses: actions/upload-artifact@v4

        with:

          name:
            aoi-native-package-godot-4.7.2-android-arm64

          path:
            dist/aoi-native-godot-4.7.2-android-arm64.tar.gz

          if-no-files-found: error
